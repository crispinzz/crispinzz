name: Update stats

# Regenerates assets/contributions.svg and assets/stats.svg from real
# contribution data. Scheduled twice an hour on off-peak minutes (GitHub's
# cron is best-effort, so runs may be delayed), on every push to main, and
# on demand.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SVGs
        run: python3 scripts/build_stats.py ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh stats [skip ci]"
          git pull --rebase
          git push
